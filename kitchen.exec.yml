---
driver:
  name: exec
  chef_omnibus_install: false

transport:
  name: exec

provisioner:
  name: chef_infra
  product_name: cinc
  product_version: latest
  channel: stable
  chef_license: accept
  deprecations_as_errors: true
  enforce_idempotency: true
  multiple_converge: 2
  policyfile: Policyfile.rb

verifier:
  name: inspec

platforms:
  - name: windows-2019

x-verifiers:
  default: &default_verifier
    inspec_tests:
      - path: test/integration/default

suites:
  - name: default
    provisioner:
      named_run_list: default
    verifier: *default_verifier
